<style>
  :root {
    --bg: #0E0F11; --ink: #f2efe6; --mute: #9a978c; --line: rgba(255,255,255,.10);
    --field: rgba(255,255,255,.045); --field-line: rgba(255,255,255,.12);
    --card-a: #14161a; --card-b: #0c0d10; --glow: rgba(212,175,55,.55); --sheen: rgba(255,255,255,.16);
    --gold: #e0b94a; --gold-ink: #17130a; --err: #ff8a78; --ok: #5fd6c0;
  }
  body.light {
    --bg: #f4f2ec; --ink: #1d1c18; --mute: #6c6a62; --line: rgba(0,0,0,.10);
    --field: rgba(255,255,255,.75); --field-line: rgba(0,0,0,.14);
    --card-a: #ffffff; --card-b: #f3efe3; --glow: rgba(212,175,55,.42); --sheen: rgba(0,0,0,.05);
    --gold: #b8942a; --gold-ink: #ffffff; --err: #b83526; --ok: #0f766e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    color: var(--ink); background-color: var(--bg);
    font-variant-numeric:lining-nums tabular-nums;
    -webkit-font-smoothing:antialiased;
    font-optical-sizing:auto;

    background-image:
      radial-gradient(ellipse 900px 520px at 12% -8%, rgba(212,175,55,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 105% 8%, rgba(212,175,55,.08), transparent 55%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 15px; font-weight: 600; letter-spacing: .02em; color: var(--ink); }
  .brand img { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; border: 1px solid var(--line); }
  .brand span { opacity: .85; }

  .card {
    position: relative; overflow: hidden; isolation: isolate; width: 100%; max-width: 400px;
    border-radius: 28px; padding: 36px 28px 28px; text-align: center;
    background: linear-gradient(180deg, var(--card-a), var(--card-b)); border: 1px solid var(--line);
    box-shadow: 0 30px 60px -28px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    animation: in .35s cubic-bezier(.2,.8,.2,1) both;
  }
  .card::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(130px 120px at 0% 0%, var(--glow), transparent 70%), linear-gradient(118deg, transparent 52%, var(--sheen) 70%, transparent 86%);
    -webkit-mask-image: linear-gradient(180deg,#000 0,#000 38%,transparent 62%); mask-image: linear-gradient(180deg,#000 0,#000 38%,transparent 62%); }
  .card::after { content: ""; position: absolute; left: 14%; right: 14%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--glow), transparent); }
  @keyframes in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

  .badge { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
    background: var(--field); border: 1px solid var(--line); color: var(--gold); }
  .badge svg { width: 26px; height: 26px; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.bad { color: var(--err); border-color: var(--err); }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
  .sub { margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: var(--mute); overflow-wrap: anywhere; }
  .sub b { color: var(--ink); font-weight: 600; }

  form { margin-top: 28px; text-align: left; }
  .field { display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 8px 8px 8px 24px; border-radius: 999px;
    background: var(--field); border: 1px solid var(--field-line); cursor: text; transition: border-color .18s, box-shadow .18s; }
  .field:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,.18); }
  .field.bad { border-color: var(--err); }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  label { font-size: 12px; font-weight: 500; color: var(--mute); }
  .field:focus-within label { color: var(--gold); }
  input { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; margin: 0; padding: 4px 0 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 17px; font-weight: 500; color: var(--ink); caret-color: var(--gold); box-shadow: none; }
  input::placeholder { color: var(--mute); opacity: .65; }
  input:-webkit-autofill { -webkit-text-fill-color: var(--ink); -webkit-box-shadow: 0 0 0 40px var(--card-b) inset; transition: background-color 9999s; }
  .eye { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--mute); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .eye:hover { color: var(--ink); } .eye svg { width: 20px; height: 20px; }
  .go { flex: none; width: 46px; height: 46px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--gold-ink);
    background: linear-gradient(135deg,#f0d477,#d4af37 60%,#b8942a); box-shadow: 0 8px 20px -8px rgba(212,175,55,.75), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .15s, filter .15s; }
  .go:hover { filter: brightness(1.06); } .go:active { transform: scale(.94); } .go[disabled] { cursor: progress; filter: saturate(.6) brightness(.9); }
  .go svg { width: 20px; height: 20px; }
  .spin { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .rules { list-style: none; margin: 16px 8px 4px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 13px; color: var(--mute); }
  .rules li { display: flex; align-items: center; gap: 8px; }
  .rules li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--mute); transition: all .15s; }
  .rules li.ok { color: var(--ink); } .rules li.ok::before { background: var(--ok); border-color: var(--ok); }
  .msg { min-height: 0; margin: 12px 8px 0; font-size: 13px; line-height: 1.4; text-align: center; color: var(--err); }
  .msg:empty { margin: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 28px; min-height: 52px; padding: 0 28px; border-radius: 999px; border: 0; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--gold-ink);
    background: linear-gradient(135deg,#f0d477,#d4af37 60%,#b8942a); box-shadow: 0 10px 24px -10px rgba(212,175,55,.7), inset 0 1px 0 rgba(255,255,255,.4); }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: var(--field); color: var(--ink); box-shadow: none; border: 1px solid var(--field-line); margin-top: 12px; }
  .btn-wrap { display: flex; flex-direction: column; align-items: center; }
  .foot { margin: 24px 0 0; font-size: 12px; color: var(--mute); opacity: .8; }
  .loader { margin: 8px auto 4px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: rot .8s linear infinite; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 12px; }
  .field input:focus-visible { outline: 0; }
  @media (max-width: 380px) { .card { padding: 32px 20px 24px; border-radius: 28px; } h1 { font-size: 22px; } .rules { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .spin, .loader { animation-duration: 1.8s; } }
</style>

<body>
  <div class="brand"><img src="icons/logo-512.png" alt="" /><span>Doa Ibu Trading Journal</span></div>

  <main class="card" id="card" aria-live="polite">
    <!-- Memuat -->
    <section id="v-load"><div class="loader" role="status" aria-label="Loading"></div><p class="sub" id="t-load"></p></section>

    <!-- Form password baru -->

      <h1 id="t-reset-title"></h1>
      <p class="sub" id="t-reset-sub"></p>
      <form id="form" novalidate>
        <div class="field" id="f-pass">
          <div class="body">
            <label for="pass" id="t-pass-label"></label>
            <input id="pass" type="password" autocomplete="new-password" maxlength="4096" />
          </div>
          <button type="button" class="eye" id="eye"></button>
          <button type="submit" class="go" id="go"></button>
        </div>
        <ul class="rules" id="rules"></ul>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </section>

    <!-- Hasil (sukses / gagal) -->
    <section id="v-done" class="hidden">
      <div class="badge" id="done-badge" aria-hidden="true"></div>
      <h1 id="done-title"></h1>
      <p class="sub" id="done-sub"></p>
      <div class="btn-wrap">
        <a class="btn" id="done-btn" href="./"></a>
        <a class="btn ghost hidden" id="done-btn2" href="./"></a>
      </div>
    </section>

    <p class="foot" id="t-foot"></p>
  </main>

  }

  var mode = q.get('mode'), code = q.get('oobCode');
  if (!mode || !code) { done('bad'); return; }
  if (!window.firebase) { done('bad'); return; }
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth(); auth.languageCode = L;

  if (mode === 'resetPassword') {
    auth.verifyPasswordResetCode(code).then(function (email) { startReset(auth, code, email); }).catch(function () { done('bad'); });
  } else if (mode === 'verifyEmail') {
    auth.checkActionCode(code).then(function (info) {
      var mail = info && info.data && info.data.email;
      return auth.applyActionCode(code).then(function () { done('verify', mail || ''); });
    }).catch(function () { done('bad'); });
  } else if (mode === 'recoverEmail') {
    auth.checkActionCode(code).then(function (info) {
      var restored = info && info.data && info.data.email;
      return auth.applyActionCode(code).then(function () { done('recover', restored || ''); });
    }).catch(function () { done('bad'); });
  } else { done('bad'); }
})();
</script>
